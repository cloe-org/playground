name: Update repo structure diagram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate structure diagram
        run: python scripts/generate_structure.py --update

      - name: Commit and push README update branch
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B github-actions/update-structure
          git add README.md
          git commit -m "docs: update repository structure diagram [skip ci]"
          git push --force-with-lease origin HEAD:github-actions/update-structure
