name: Update repo structure diagram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate structure diagram
        run: python scripts/generate_structure.py --update

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update repository structure diagram [skip ci]"

      - name: Create pull request for changes
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update repository structure diagram [skip ci]"
          branch: "auto/update-structure-${{ github.run_id }}"
          title: "Update repository structure diagram"
          body: |
            Automated update of repository structure diagram.
          labels: automated
          delete-branch: true